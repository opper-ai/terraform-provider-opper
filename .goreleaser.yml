version: 2
project_name: terraform-provider-opper

# Terraform's packed filesystem mirror normalizes filenames to lowercase.
snapshot:
  version_template: '{{ .Version }}-snapshot-{{ .ShortCommit }}'

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    binary: '{{ .ProjectName }}_v{{ .Version }}'
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64, arm, s390x]
    goarm: ['6']
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE]

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - '{{ .Env.GPG_FINGERPRINT }}'
      - --output
      - '${signature}'
      - --detach-sign
      - '${artifact}'

release:
  # Publishing the reviewed draft is a separate operator action.
  draft: true
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

# The release workflow supplies reviewed notes with --release-notes. Disabling
# changelog also discards that file and creates a draft with an empty body.
